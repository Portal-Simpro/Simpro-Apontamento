<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Portal SIMPRO</title>

  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#FACC15">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="https://img.icons8.com/color/192/timer.png">

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    html, body { 
      width: 100%; 
      height: 100%; 
      overflow: hidden; 
      background-color: #F1F5F9; 
      display: flex; 
      justify-content: center; 
      align-items: center; 
    }
    
    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
    
    /* Efeito "Simulador de Celular" apenas para quem abrir no PC */
    @media (min-width: 600px) {
      iframe {
        max-width: 430px; /* Largura padrão de um celular grande */
        height: 90vh;     /* Ocupa 90% da altura da tela */
        border-radius: 24px; 
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25); /* Sombra elegante */
        background-color: #F1F5F9;
      }
    }
  </style>
</head>
<body>

  <!-- URL DO GOOGLE APPS SCRIPT PUBLICADO (COM PARÂMETRO DE REVALIDAÇÃO) -->
  <iframe 
    id="portalSimproFrame"
    src="https://script.google.com/macros/s/AKfycbxDw8-NObFcdqhWD4JyW5mQKiED4UaUXcHTy_Ztwtjlb25vBGgiYnwuU7Fttte6pHZVtQ/exec?v=2.1.0" 
    allow="geolocation; camera; microphone">
  </iframe>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js?v=2.1.0').then(function(registration) {
        registration.update();
      });
    }
  </script>
</body>
</html>
